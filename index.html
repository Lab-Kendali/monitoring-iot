<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring IoT ESP32</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f7;
    color: #1f2937;
}

/* =====================================================
   HEADER
   ===================================================== */

.header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white;
    text-align: center;
    padding: 35px 20px 30px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 700;
}

.header p {
    margin: 10px 0 18px;
    font-size: 20px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    background: rgba(255,255,255,0.15);

    padding: 10px 20px;

    border-radius: 30px;

    font-size: 16px;
    font-weight: bold;
}

.status-dot {
    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #22c55e;

    box-shadow: 0 0 10px #22c55e;
}

/* =====================================================
   CONTAINER
   ===================================================== */

.container {
    width: 92%;
    max-width: 1400px;

    margin: 35px auto;
}

/* =====================================================
   SENSOR GRID
   ===================================================== */

.sensor-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(300px, 1fr));

    gap: 30px;
}

/* =====================================================
   CARD
   ===================================================== */

.card {
    background: white;

    border-radius: 22px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.08);

    transition: transform 0.25s ease;
}

.card:hover {
    transform: translateY(-3px);
}

.card h2 {
    margin: 0 0 20px;

    font-size: 26px;
}

/* =====================================================
   GAUGE
   ===================================================== */

.gauge {
    position: relative;

    width: 280px;
    height: 280px;

    margin: 0 auto 15px;
}

/*
   Lingkaran gauge
*/

.gauge-ring {
    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:
        conic-gradient(
            from 225deg,
            #2563eb 0deg,
            #2563eb var(--progress),
            #e5e7eb var(--progress),
            #e5e7eb 270deg,
            transparent 270deg
        );

    transform: rotate(0deg);
}

/*
   Lubang tengah
*/

.gauge-ring::after {
    content: "";

    position: absolute;

    width: 72%;

    height: 72%;

    left: 14%;
    top: 14%;

    border-radius: 50%;

    background: white;
}

/* =====================================================
   NILAI TENGAH
   ===================================================== */

.gauge-value {
    position: absolute;

    top: 70%;
    left: 50%;

    transform: translate(-50%, -45%);

    z-index: 5;

    text-align: center;

    width: 160px;
}

.value-number {
    font-size: 45px;

    font-weight: 700;

    line-height: 1;
}

.value-unit {
    margin-top: 8px;

    font-size: 19px;

    color: #64748b;
}

/* =====================================================
   JARUM
   ===================================================== */

.needle {
    position: absolute;

    width: 5px;
    height: 105px;

    background: #1f2937;

    left: calc(50% - 2.5px);

    top: calc(50% - 105px);

    transform-origin: 50% 100%;

    transform:
        rotate(var(--needle-angle));

    border-radius: 5px;

    z-index: 7;

    transition:
        transform 0.8s cubic-bezier(.4,2,.6,1);
}

/* Titik tengah jarum */

.needle-center {
    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #1f2937;

    left: calc(50% - 11px);
    top: calc(50% - 11px);

    z-index: 8;
}

/* =====================================================
   UPDATE TIME
   ===================================================== */

.update {
    color: #64748b;

    font-size: 16px;

    margin-top: 10px;
}

/* =====================================================
   TABEL
   ===================================================== */

.table-card {
    margin-top: 35px;

    background: white;

    border-radius: 22px;

    padding: 30px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
}

.table-card h2 {
    margin-top: 0;

    text-align: center;

    font-size: 28px;
}

.table-wrapper {
    width: 100%;

    overflow-x: auto;

    max-height: 600px;

    overflow-y: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 850px;
}

thead {
    position: sticky;

    top: 0;

    z-index: 10;
}

th {
    background: #1e3a8a;

    color: white;

    padding: 15px;

    font-size: 15px;
}

td {
    padding: 14px;

    text-align: center;

    border-bottom: 1px solid #e5e7eb;

    font-size: 15px;
}

tbody tr:hover {
    background: #f8fafc;
}

/* =====================================================
   GRAFIK
   ===================================================== */

.chart-card {
    margin-top: 35px;

    background: white;

    border-radius: 22px;

    padding: 30px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
}

.chart-card h2 {
    text-align: center;

    margin-top: 0;

    font-size: 28px;
}

.chart-container {
    position: relative;

    width: 100%;

    height: 420px;
}

canvas {
    width: 100% !important;

    height: 100% !important;
}

/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 850px) {

    .sensor-grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 30px;
    }

    .header p {
        font-size: 17px;
    }

    .gauge {
        width: 250px;
        height: 250px;
    }
}

</style>

</head>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://dbodgclttbalohgpanpk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0b3vY7OTUEoI5nyM0wmvVQ_V0CUS4HA";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   KONFIGURASI
   ===================================================== */

const VOLUME_MAX = 30;

const SUHU_MIN = 0;
const SUHU_MAX = 50;

const HUM_MIN = 0;
const HUM_MAX = 100;

const SOIL_ADC_MAX = 4095;


/* =====================================================
   DATA GRAFIK
   ===================================================== */

let chartData = [];


/* =====================================================
   FORMAT WAKTU WITA
   ===================================================== */

function formatWITA(waktu) {

    if (!waktu) return "-";

    const date = new Date(waktu);

    return date.toLocaleString(
        "id-ID",
        {
            timeZone: "Asia/Makassar",

            day: "2-digit",
            month: "2-digit",
            year: "numeric",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: false
        }
    );

}


/* =====================================================
   KONVERSI ADC → PERSEN
   ===================================================== */

function adcKePersen(adc) {

    adc = Number(adc);

    if (!Number.isFinite(adc)) {

        return 0;
    }

    adc = Math.max(
        0,
        Math.min(
            SOIL_ADC_MAX,
            adc
        )
    );

    let persen =
        ((SOIL_ADC_MAX - adc)
        / SOIL_ADC_MAX) * 100;

    return Math.max(
        0,
        Math.min(
            100,
            persen
        )
    );

}


/* =====================================================
   AMBIL NILAI KELEMBAPAN TANAH
   ===================================================== */

function getSoilPercent(data) {

    let nilai =
        data["Kelembapan Tanah (%)"];

    nilai = Number(nilai);

    if (!Number.isFinite(nilai)) {

        return 0;
    }

    /*
       Karena ESP32 mengirim soilADC 0–4095,
       maka jika nilainya > 100 dianggap ADC.
    */

    if (nilai > 100) {

        return adcKePersen(nilai);
    }

    /*
       Jika suatu saat ESP32 mengirim
       langsung dalam persen, nilai tersebut
       tetap bisa digunakan.
    */

    return Math.max(
        0,
        Math.min(
            100,
            nilai
        )
    );

}


/* =====================================================
   GAUGE
   ===================================================== */

function updateGauge(
    id,
    value,
    min,
    max
) {

    const gauge =
        document.getElementById(id);

    if (!gauge) return;

    value = Number(value);

    if (!Number.isFinite(value)) {

        value = min;
    }

    value =
        Math.max(
            min,
            Math.min(
                max,
                value
            )
        );

    const persen =
        (value - min) /
        (max - min);

    /*
       Gauge 270 derajat
    */

    const progress =
        persen * 270;

    /*
       Jarum:
       -135° sampai +135°
    */

    const angle =
        -135 + (persen * 270);

    gauge.style.setProperty(
        "--progress",
        progress + "deg"
    );

    gauge.style.setProperty(
        "--needle-angle",
        angle + "deg"
    );

}


/* =====================================================
   UPDATE GAUGE VOLUME
   ===================================================== */

function updateVolume(value) {

    updateGauge(
        "gaugeVolume",
        value,
        0,
        VOLUME_MAX
    );

    document.getElementById(
        "volumeValue"
    ).textContent =
        Number(value).toFixed(1);

}


/* =====================================================
   UPDATE GAUGE SUHU
   ===================================================== */

function updateSuhu(value) {

    updateGauge(
        "gaugeSuhu",
        value,
        SUHU_MIN,
        SUHU_MAX
    );

    document.getElementById(
        "suhuValue"
    ).textContent =
        Number(value).toFixed(1);

}


/* =====================================================
   UPDATE GAUGE UDARA
   ===================================================== */

function updateUdara(value) {

    updateGauge(
        "gaugeUdara",
        value,
        0,
        100
    );

    document.getElementById(
        "udaraValue"
    ).textContent =
        Number(value).toFixed(1);

}


/* =====================================================
   UPDATE GAUGE TANAH
   ===================================================== */

function updateTanah(value) {

    updateGauge(
        "gaugeTanah",
        value,
        0,
        100
    );

    document.getElementById(
        "tanahValue"
    ).textContent =
        Number(value).toFixed(1);

}


/* =====================================================
   UPDATE MONITORING
   ===================================================== */

function updateMonitoring(data) {

    if (!data) return;


    const volume =
        Number(
            data["Volume (L)"]
        );


    const suhu =
        Number(
            data["Suhu (°C)"]
        );


    const udara =
        Number(
            data["Kelembapan Udara (%)"]
        );


    const tanah =
        getSoilPercent(data);


    /* Volume */

    if (Number.isFinite(volume)) {

        updateVolume(volume);
    }


    /* Suhu */

    if (Number.isFinite(suhu)) {

        updateSuhu(suhu);
    }


    /* Udara */

    if (Number.isFinite(udara)) {

        updateUdara(udara);
    }


    /* Tanah */

    updateTanah(tanah);


    /* Waktu */

    const waktu =
        formatWITA(data.Waktu);


    document.getElementById(
        "volumeUpdate"
    ).textContent =
        "Update: " + waktu;


    document.getElementById(
        "suhuUpdate"
    ).textContent =
        "Update: " + waktu;


    document.getElementById(
        "udaraUpdate"
    ).textContent =
        "Update: " + waktu;


    document.getElementById(
        "tanahUpdate"
    ).textContent =
        "Update: " + waktu;

}


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
    online,
    text
) {

    const dot =
        document.getElementById(
            "statusDot"
        );

    const statusText =
        document.getElementById(
            "statusText"
        );

    statusText.textContent =
        text;

    if (online) {

        dot.style.background =
            "#22c55e";

        dot.style.boxShadow =
            "0 0 10px #22c55e";

    } else {

        dot.style.background =
            "#ef4444";

        dot.style.boxShadow =
            "0 0 10px #ef4444";
    }

}


/* =====================================================
   TABEL
   ===================================================== */

function renderTable(data) {

    const tbody =
        document.getElementById(
            "dataTable"
        );

    tbody.innerHTML = "";


    data.forEach(
        function(row) {

            const tr =
                document.createElement(
                    "tr"
                );


            const volume =
                Number(
                    row["Volume (L)"]
                );


            const suhu =
                Number(
                    row["Suhu (°C)"]
                );


            const udara =
                Number(
                    row["Kelembapan Udara (%)"]
                );


            const tanah =
                getSoilPercent(row);


            tr.innerHTML = `

                <td>
                    ${row.No ?? "-"}
                </td>

                <td>
                    ${formatWITA(row.Waktu)}
                </td>

                <td>
                    ${Number.isFinite(volume)
                        ? volume.toFixed(2)
                        : "-"} L
                </td>

                <td>
                    ${Number.isFinite(suhu)
                        ? suhu.toFixed(1)
                        : "-"} °C
                </td>

                <td>
                    ${Number.isFinite(udara)
                        ? udara.toFixed(1)
                        : "-"} %
                </td>

                <td>
                    ${tanah.toFixed(1)} %
                </td>

            `;


            tbody.appendChild(tr);

        }
    );

}


/* =====================================================
   CHART
   ===================================================== */

const ctx =
    document.getElementById(
        "sensorChart"
    );


const sensorChart =
    new Chart(
        ctx,
        {

            type: "line",

            data: {

                labels: [],

                datasets: [

                    {
                        label: "Volume (L)",

                        data: [],

                        borderWidth: 2,

                        tension: 0.3,

                        pointRadius: 2
                    },

                    {
                        label: "Suhu (°C)",

                        data: [],

                        borderWidth: 2,

                        tension: 0.3,

                        pointRadius: 2
                    },

                    {
                        label: "Kelembapan Udara (%)",

                        data: [],

                        borderWidth: 2,

                        tension: 0.3,

                        pointRadius: 2
                    },

                    {
                        label: "Kelembapan Tanah (%)",

                        data: [],

                        borderWidth: 2,

                        tension: 0.3,

                        pointRadius: 2
                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        }
    );


/* =====================================================
   UPDATE CHART
   ===================================================== */

function updateChart(data) {

    /*
       Data ditampilkan dari yang lama
       ke yang terbaru.
    */

    const sorted =
        [...data].sort(
            (a,b) =>
                new Date(a.Waktu)
                -
                new Date(b.Waktu)
        );


    sensorChart.data.labels =
        sorted.map(
            row =>
                formatWITA(row.Waktu)
        );


    sensorChart.data.datasets[0].data =
        sorted.map(
            row =>
                Number(
                    row["Volume (L)"]
                )
        );


    sensorChart.data.datasets[1].data =
        sorted.map(
            row =>
                Number(
                    row["Suhu (°C)"]
                )
        );


    sensorChart.data.datasets[2].data =
        sorted.map(
            row =>
                Number(
                    row["Kelembapan Udara (%)"]
                )
        );


    sensorChart.data.datasets[3].data =
        sorted.map(
            row =>
                getSoilPercent(row)
        );


    sensorChart.update(
        "none"
    );

}


/* =====================================================
   AMBIL DATA AWAL
   ===================================================== */

async function loadData() {

    setStatus(
        false,
        "MENGAMBIL DATA..."
    );


    const {
        data,
        error
    } = await supabaseClient

        .from("Data_Sensor")

        .select(
            '"No",Waktu,"Volume (L)","Suhu (°C)","Kelembapan Udara (%)","Kelembapan Tanah (%)"'
        )

        .order(
            "No",
            {
                ascending: false
            }
        )

        .limit(100);


    if (error) {

        console.error(
            "Error mengambil data:",
            error
        );

        setStatus(
            false,
            "ERROR DATABASE"
        );

        return;
    }


    if (!data || data.length === 0) {

        setStatus(
            false,
            "BELUM ADA DATA"
        );

        return;
    }


    /*
       Data terbaru berada di index pertama.
    */

    updateMonitoring(
        data[0]
    );


    renderTable(
        data
    );


    updateChart(
        data
    );


    setStatus(
        true,
        "DATA REALTIME TERHUBUNG"
    );

}


/* =====================================================
   REALTIME SUPABASE
   ===================================================== */

function startRealtime() {

    supabaseClient

        .channel(
            "monitoring-data"
        )

        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "Data_Sensor"
            },

            function(payload) {

                console.log(
                    "Data baru diterima:",
                    payload.new
                );


                const newData =
                    payload.new;


                /* =============================
                   UPDATE GAUGE
                   ============================= */

                updateMonitoring(
                    newData
                );


                /* =============================
                   UPDATE TABEL
                   ============================= */

                const tbody =
                    document.getElementById(
                        "dataTable"
                    );


                const tr =
                    document.createElement(
                        "tr"
                    );


                const volume =
                    Number(
                        newData["Volume (L)"]
                    );


                const suhu =
                    Number(
                        newData["Suhu (°C)"]
                    );


                const udara =
                    Number(
                        newData["Kelembapan Udara (%)"]
                    );


                const tanah =
                    getSoilPercent(
                        newData
                    );


                tr.innerHTML = `

                    <td>
                        ${newData.No ?? "-"}
                    </td>

                    <td>
                        ${formatWITA(
                            newData.Waktu
                        )}
                    </td>

                    <td>
                        ${Number.isFinite(volume)
                            ? volume.toFixed(2)
                            : "-"} L
                    </td>

                    <td>
                        ${Number.isFinite(suhu)
                            ? suhu.toFixed(1)
                            : "-"} °C
                    </td>

                    <td>
                        ${Number.isFinite(udara)
                            ? udara.toFixed(1)
                            : "-"} %
                    </td>

                    <td>
                        ${tanah.toFixed(1)} %
                    </td>

                `;


                /*
                   Data terbaru di paling atas.
                */

                tbody.prepend(
                    tr
                );


                /*
                   Batasi tabel menjadi
                   100 data terbaru.
                */

                while (
                    tbody.children.length > 100
                ) {

                    tbody.removeChild(
                        tbody.lastChild
                    );

                }


                /* =============================
                   UPDATE GRAFIK
                   ============================= */

                chartData.push(
                    newData
                );


                /*
                   Maksimal 100 titik grafik.
                */

                if (
                    chartData.length > 100
                ) {

                    chartData.shift();

                }


                updateChart(
                    chartData
                );

            }

        )

        .subscribe(
            function(status) {

                console.log(
                    "Status Realtime:",
                    status
                );


                if (
                    status ===
                    "SUBSCRIBED"
                ) {

                    setStatus(
                        true,
                        "DATA REALTIME TERHUBUNG"
                    );

                }

            }
        );

}


/* =====================================================
   MULAI
   ===================================================== */

async function mulai() {

    await loadData();


    /*
       Simpan data awal untuk grafik.
       Ambil lagi agar chartData memiliki
       data yang sama dengan grafik.
    */

    const {
        data
    } = await supabaseClient

        .from("Data_Sensor")

        .select(
            '"No",Waktu,"Volume (L)","Suhu (°C)","Kelembapan Udara (%)","Kelembapan Tanah (%)"'
        )

        .order(
            "No",
            {
                ascending: false
            }
        )

        .limit(100);


    chartData =
        data
        ? [...data]
        : [];


    startRealtime();

}


/* =====================================================
   JALANKAN
   ===================================================== */

mulai();

</script>
